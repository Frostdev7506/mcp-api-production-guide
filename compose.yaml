name: mcp-support-tutorial
services:
  db:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:?set SUPPORT_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    ports: ["127.0.0.1:5547:5432"]
    volumes:
      - support-data:/var/lib/postgresql
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-support.sh:ro
      - ./migrations/001-ticket-schema.sql:/opt/support/001-ticket-schema.sql:ro
      - ./infra/seed-local.sql:/opt/support/seed-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 20
    mem_limit: 512m
  auth:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start", "--http-enabled=true", "--hostname=http://127.0.0.1:8187", "--import-realm", "--features=resource-indicators"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: tutorial-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8187:8080"]
    volumes: ["./infra/support-demo-realm.json:/opt/keycloak/data/import/support-demo-realm.json:ro"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
volumes:
  support-data:
